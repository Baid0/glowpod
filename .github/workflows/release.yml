# Push a tag like v0.2.0 to publish:
#   ghcr.io/<owner>/glowpod:0.2.0 (amd64 + arm64) and
#   oci://ghcr.io/<owner>/charts/glowpod version 0.2.0.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version and owner
        id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # Image names must be lowercase; GitHub owners needn't be.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/glowpod:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/glowpod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        run: |
          owner="${{ steps.v.outputs.owner }}"
          # The published chart points at the image published with it.
          sed -i "s#repository: ghcr.io/glowpod/glowpod#repository: ghcr.io/${owner}/glowpod#" deploy/helm/glowpod/values.yaml
          helm package deploy/helm/glowpod \
            --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "glowpod-${{ steps.v.outputs.version }}.tgz" "oci://ghcr.io/${owner}/charts"

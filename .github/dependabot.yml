# Weekly update PRs, grouped so they're few: CI runs on each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: gomod
    directory: /backend
    schedule: {interval: weekly}
    groups:
      go: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet (lint fails).
      # Drop this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      frontend: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}

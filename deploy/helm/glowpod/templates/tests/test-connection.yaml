# helm test: Glowpod answers on its Service and the sign-in page knows its methods.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "glowpod.fullname" . }}-test
  labels:
    {{- include "glowpod.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: {{ .Values.tests.image }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      command:
        - sh
        - -c
        - |
          set -e
          base=http://{{ include "glowpod.fullname" . }}:{{ .Values.service.port }}
          wget -qO- "$base/healthz" | grep -q '"ok"'
          {{- /* With publicURL set, Glowpod answers only to that host name. */}}
          wget -qO- {{ with .Values.publicURL }}--header "Host: {{ (urlParse .).host }}" {{ end }}"$base/api/v1/auth/methods" | grep -q '"methods"'
          echo "Glowpod is up."

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "glowpod.fullname" . }}
  labels:
    {{- include "glowpod.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "glowpod.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if and .Values.hub.enabled .Values.hub.shell.enabled }}
    # The Hub's browser shells.
    - ports:
        - port: shell
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: glowpod-shell
    {{- end }}
{{- end }}

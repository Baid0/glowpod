{{- $oidc := and .Values.auth.oidc.enabled .Values.auth.oidc.clientSecret (not .Values.auth.oidc.existingSecret) }}
{{- $ldap := and .Values.auth.ldap.enabled .Values.auth.ldap.bindPassword (not .Values.auth.ldap.existingSecret) }}
{{- if or $oidc $ldap }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "glowpod.secretName" . }}
  labels:
    {{- include "glowpod.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $oidc }}
  {{ .Values.auth.oidc.existingSecretKey }}: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
  {{- if $ldap }}
  {{ .Values.auth.ldap.existingSecretKey }}: {{ .Values.auth.ldap.bindPassword | quote }}
  {{- end }}
{{- end }}

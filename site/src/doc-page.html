<!doctype html>
<html lang="en">
  <!-- Generated by scripts/docs.mjs from {{source}}. Edit the Markdown, not this file. -->
  <head>
    <!-- @include head.html -->
    <title>{{title}} · Glowpod docs</title>
    <meta name="description" content="{{description}}" />
  </head>
  <body class="page-docs">
    <!-- @include header.html current=docs -->
    <div class="container docs-layout">
      <!-- @include docs-nav.html current={{slug}} -->
      <main id="main" class="docs-main">
        <article class="docs-article">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="/docs/">Docs</a><span aria-hidden="true">/</span
            ><span aria-current="page">{{title}}</span>
          </nav>
          <h1 class="docs-title">{{title}}</h1>
          <div class="prose">{{content}}</div>
          <div class="docs-edit">
            <a href="{{source}}">Edit this page on GitHub</a>
          </div>
          <nav class="pager" aria-label="Previous and next">{{pager}}</nav>
        </article>
        <aside class="toc" aria-labelledby="toc-h">
          <h2 id="toc-h" class="eyebrow">On this page</h2>
          {{toc}}
        </aside>
      </main>
    </div>
    <!-- @include footer.html -->
  </body>
</html>

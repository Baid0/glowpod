        - kind: changed
          description: "Glowpod moved to the glowpod-dev organization: the repository is https://github.com/glowpod-dev/glowpod, the image ghcr.io/glowpod-dev/glowpod and the OCI chart oci://ghcr.io/glowpod-dev/charts/glowpod. Old links redirect, and 0.1.2 and earlier stay at ghcr.io/baid0. Releases are now signed by the glowpod-dev/glowpod workflow; see the install guide for the new verify commands."
        - kind: changed
          description: "The home page installs with helm repo add."
        - kind: added
          description: "Classic chart repository: helm repo add glowpod https://glowpod.dev/charts. Every release adds its version, and the chart file is attached to the GitHub Release (with a checksum and a build attestation). 0.1.1 and 0.1.2 are in it already."
        - kind: added
          description: "Artifact Hub: the chart lists its image (for security scanning), each release's changes from this changelog, a category and links to the website, docs and security policy. The chart's README links to glowpod.dev, so they work on the package page."

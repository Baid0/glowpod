apiVersion: v1
entries:
  glowpod:
  - annotations:
      artifacthub.io/category: monitoring-logging
      artifacthub.io/changes: |
        - kind: added
          description: "Glowpod Hub: one Glowpod for many clusters, the way Rancher works (guide). Install the chart with hub.enabled: true; at first start, sign in as admin with the bootstrap password and set your own. Import a cluster under Clusters \u2192 Import: one kubectl apply installs glowpod-agent, which connects out to the Hub (the cluster needs no inbound access). Overview, lists, YAML, logs and pod shells all work through the agent, which can only impersonate the person signed in and refuses system: names. Each person sees the clusters where they or their groups are bound; Hub administrators see all of them and can remove a cluster, which revokes its agent."
        - kind: added
          description: "Sign in with a Glowpod account (the Hub's admin), next to SSO and LDAP."
        - kind: added
          description: "-ldap-username-prefix (auth.ldap.usernamePrefix), for usernames such as ldap:bob."
        - kind: added
          description: "Many clusters in local mode. Every context in your kubeconfig is a cluster: glowpod opens your current context (or the one given with -context), and a new Clusters page lists them all with their state (connected, unreachable, credentials refused), Kubernetes version, ready nodes, CPU, memory and pod gauges, and what needs attention. The cluster picker switches between them and keeps you on the same kind of page; \u2318K lists them too. Picked namespaces are remembered per cluster."
        - kind: added
          description: "Page addresses carry the cluster: /c/<cluster>/workloads/pods. Links from before (such as /workloads/pods) open on the current cluster."
        - kind: added
          description: "API: GET /api/v1/clusters lists the clusters; GET /api/v1/clusters/{cluster}/summary is one row of the Clusters page."
        - kind: changed
          description: "A cluster that doesn't answer shows an error within about 10 seconds instead of loading for a minute: connecting gives up after 10 seconds, the Overview stops as soon as nodes or pods fail, and the browser doesn't retry a cluster that timed out."
        - kind: changed
          description: "GET /api/v1/session no longer lists clusters; use GET /api/v1/clusters."
        - kind: fixed
          description: "A local launch link (glowpod -no-browser) opens the cluster it was started for."
        - kind: fixed
          description: "In-cluster Glowpod refuses Microsoft's shared sign-in addresses (common, organizations, consumers) at startup and says to use the tenant ID."
      artifacthub.io/images: |
        - name: glowpod
          image: ghcr.io/glowpod-dev/glowpod:0.4.0
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: Website
          url: https://glowpod.dev
        - name: Documentation
          url: https://glowpod.dev/docs/
        - name: Install guide

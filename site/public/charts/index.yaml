    version: 0.7.1
  - annotations:
      artifacthub.io/category: monitoring-logging
      artifacthub.io/changes: |
        - kind: added
          description: "Backup and restore of a Hub (Hub settings \u2192 Backup and restore): one file with the Glowpod accounts, sign-in settings, server URL and imported clusters, encrypted with a passphrase (AES-256-GCM, Argon2id). Restore it on a Hub in use, or on a new Hub at first start to move there; agents reconnect with the credentials they have (guide)."
        - kind: added
          description: "Hub settings for Hub administrators (account menu): add Glowpod accounts as User or Administrator, reset passwords, change roles, delete accounts (each ends that person's sign-ins and kubeconfigs); set up SSO (OIDC) and LDAP / Active Directory in the UI, with a Check button, taking effect without a restart; change the server URL (guide). Helm values and flags still win. Glowpod accounts change their own password from the account menu."
        - kind: added
          description: "Members and projects: Cluster \u2192 Members gives a person or group a role in the whole cluster (Owner, Read-only, or any ClusterRole), and Cluster \u2192 Projects groups namespaces (such as payments-api + payments-db) and gives a team a role in all of them (Owner, Member, Read-only) (guide). It's all the cluster's own RBAC, made as you, so you can only give what you have; access made with kubectl or GitOps is listed too. Works in every mode."
        - kind: fixed
          description: "On a Hub, every cluster was listed for everyone: Kubernetes binds its own discovery roles to all signed-in users, and those counted as access. Now only real grants count: bindings to system: roles don't, and \"everyone\" counts only through a cluster-wide binding (a tool's narrow role for everyone in one namespace doesn't). Imported clusters need their agent upgraded: choose Connect on each and run its command again."
      artifacthub.io/images: |
        - name: glowpod
          image: ghcr.io/glowpod-dev/glowpod:0.7.0
      artifacthub.io/license: MIT
      artifacthub.io/links: |

          description: "glowpod term: Glowpod in the terminal. It starts on Glance (half-gauges drawn in the terminal, what needs attention in plain words, recent events); Tab goes to Deep, with the API server's columns for any resource or CRD, / filter, namespace switching, live updates and a : command palette. Pods open to live logs (warnings orange, errors red), events and YAML. Scale, restart, delete (type the name) and shell show only when RBAC allows them."
        - kind: added
          description: "Install with one command: brew install glowpod-dev/tap/glowpod on macOS and Linux, and scoop install glowpod (after scoop bucket add glowpod https://github.com/glowpod-dev/scoop-bucket) on Windows. Every release updates both."
        - kind: changed
          description: "glowpod -version prints to stdout instead of stderr, so scripts can read it."

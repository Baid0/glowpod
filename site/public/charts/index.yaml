      artifacthub.io/changes: |
        - kind: added
          description: "Try Glowpod Hub with one docker run: the new ghcr.io/glowpod-dev/glowpod-hub image runs K3s inside the container and the Hub on it, like Rancher's Docker install (guide). It serves HTTPS with its own certificate authority, which imported agents trust automatically, or with your certificate from /etc/glowpod/tls. Everything is kept in one volume. docker exec <container> glowpod hub bootstrap-password prints the first-start password."
        - kind: changed
          description: "Restarting or upgrading a Hub no longer signs everyone out: it keeps sign-ins in Secrets in its namespace (names and groups only, under a hash of the cookie), and deletes them when they expire or you sign out."

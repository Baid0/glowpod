apiVersion: v1
entries:
  glowpod:
  - annotations:
      artifacthub.io/category: monitoring-logging
      artifacthub.io/changes: |
        - kind: added
          description: "Create resources. New <Kind> on every resource list opens a template for that kind (a useful one for common kinds, a skeleton for any other kind, CRDs included) in the picked namespace; Check runs a server-side dry run and Create unlocks only for text that passed. It appears only when RBAC allows creating that kind there."
        - kind: added
          description: "Apply YAML (Deep mode): any number of objects of any kind, like kubectl apply --server-side. Check shows what would happen to each object; Apply unlocks when all pass and links each result. Fields set another way are overwritten only when you choose to, like --force-conflicts."
        - kind: added
          description: "API: POST .../resources/{group}/{version}/{resource} and POST .../apply, both with ?dryRun=true, running as the signed-in person and logged as changes."
        - kind: added
          description: "A live demo at https://glowpod.dev/demo/: the real app on a sample cluster that runs in the browser, with a crash-looping pod, a pod that doesn't fit and a node short of memory to look into. Scaling, restarting, deleting, editing YAML, the terminal and Secret reveal all work on the sample data, which resets on reload. The home page links to it."
      artifacthub.io/images: |
        - name: glowpod
          image: ghcr.io/glowpod-dev/glowpod:0.2.0
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: Website
          url: https://glowpod.dev
        - name: Documentation
          url: https://glowpod.dev/docs/
        - name: Install guide
          url: https://glowpod.dev/docs/install/
        - name: Sign-in and access
          url: https://glowpod.dev/docs/authentication/
        - name: Security policy
          url: https://github.com/glowpod-dev/glowpod/security/policy
        - name: Source
          url: https://github.com/glowpod-dev/glowpod
